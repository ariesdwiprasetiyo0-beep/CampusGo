name: CampusApp

options:
  bundleIdPrefix: com.campusgo
  deploymentTarget:
    iOS: "17.0"

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  CampusApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    productName: CampusApp
    bundleId: com.campusgo.campusapp
    
    settings:
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      PRODUCT_NAME: CampusApp
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "CampusGo membutuhkan akses lokasi untuk menampilkan posisi kamu di peta kampus."
      INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "CampusGo membutuhkan akses lokasi untuk menampilkan posisi kamu di peta kampus."
    
    sources:
      - path: CampusApp
        excludes:
          - "**/*.md"

  CampusAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    productName: CampusAppTests
    bundleId: com.campusgo.campusapp.tests
    
    settings:
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      BUNDLE_LOADER: "$(TEST_HOST)"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CampusApp.app/CampusApp"
    
    sources:
      - path: CampusAppTests
    
    dependencies:
      - target: CampusApp

schemes:
  CampusApp:
    build:
      targets:
        CampusApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CampusAppTests
      gatherCoverageData: true

configs:
  Debug:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
  Release:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: "s"
